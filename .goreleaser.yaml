version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/mcrl
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/kga/mcrl/internal/build.Version={{.Version}}
      - -X github.com/kga/mcrl/internal/build.Commit={{.FullCommit}}
      - -X github.com/kga/mcrl/internal/build.Date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
