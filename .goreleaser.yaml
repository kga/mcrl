version: 2

project_name: mcrl

before:
  hooks:
    - go mod tidy
    - ./scripts/completions.sh
    - ./scripts/third-party-licenses.sh

builds:
  - main: ./cmd/mcrl
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/kga/mcrl/internal/build.Version={{.Version}}
      - -X github.com/kga/mcrl/internal/build.Commit={{.FullCommit}}
      - -X github.com/kga/mcrl/internal/build.Date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - THIRD_PARTY_LICENSES
      - README.md
      - completions/*

checksum:
  name_template: checksums.txt

dockers_v2:
  - images:
      - ghcr.io/kga/mcrl
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    # ライセンス表示はバイナリと一緒に配る（scripts/third-party-licenses.sh）
    extra_files:
      - LICENSE
      - THIRD_PARTY_LICENSES
    labels:
      org.opencontainers.image.title: mcrl
      org.opencontainers.image.description: A command-line client for the Mackerel API
      org.opencontainers.image.source: https://github.com/kga/mcrl
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT

# リポジトリは immutable releases を有効にしている。公開後は資産もタグも変えられないので、
# 下書きにすべての資産を付けてから、オーナーが確認して公開する。
# workflow を再実行したときは、同じタグの下書きを使い回し、途中まで上げた資産は置き換える。
release:
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
  prerelease: auto

# tagpr の CHANGELOG.md と同じく、GitHub が生成するリリースノート（.github/release.yml の分類）を使う
changelog:
  use: github-native
