version: 2
updates:
  # 対象の workflow は actions.lock に載っているので、Dependabot が lockfile も同じ PR で更新する。
  # エコシステムごとに 1 本の PR にまとめて週 1 回。公開直後の版をすぐには取り込まないよう、
  # cooldown で 7 日待つ（脆弱性の修正は、これとは別に Dependabot security updates がすぐに PR にする）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ["*"]
  # Dockerfile のベースイメージ（ダイジェストで固定）
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
