name: CI

# PR と main への push で回す。main の必須チェックは最後の ci-ok だけにしてある。
# - テストは Linux（Go 2 版、-race つき）と macOS・Windows（最新の Go）で回す。
#   公開リポジトリでは標準のランナーが無料なので、OS ごとの違いも PR の時点で見つける
# - ドキュメント・dev/・LICENSE だけの PR では重いジョブを飛ばす。paths-ignore を使わないのは、
#   workflow ごと起動しないと必須チェックが報告されず、PR をマージできなくなるため
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # main への push はいつでも全部回す
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          printf 'changed files:\n%s\n' "$changed"
          # docs/reference はコマンドから生成するので、テスト（TestReferenceUpToDate）で確かめる
          if printf '%s\n' "$changed" | grep -qvE '^(docs/|dev/|LICENSE$)|\.md$' ||
            printf '%s\n' "$changed" | grep -qE '^docs/reference/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, go: "1.27.x", race: "-race" }
          - { os: ubuntu-latest, go: "1.26.x", race: "-race" }
          # -race は cgo が要るので、macOS・Windows では付けない（cross-platform.yml と同じ）
          - { os: macos-latest, go: "1.27.x", race: "" }
          - { os: windows-latest, go: "1.27.x", race: "" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      # エンドポイントの網羅（TestEndpointCoverage）と docs/reference が生成し直しても
      # 変わらないこと（TestReferenceUpToDate）も、ここで確かめる
      - run: go test ${{ matrix.race }} ./...

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  vulncheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # actions.lock が全 workflow の依存を正しく固定しているかを確かめる
  actions-lock:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify .github/workflows/actions.lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.0
          gh actions-lock --verify

  # main の必須チェック。上のジョブが成功または（変更なしで）スキップなら成功する
  ci-ok:
    needs: [changes, test, lint, vulncheck, actions-lock]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job ended with $r"; exit 1 ;;
            esac
          done
