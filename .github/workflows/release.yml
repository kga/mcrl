name: Release

# v* タグ（通常は tagpr が打つ）でリリースを作って公開する。承認はリリース PR のマージで済んでいる。
# 1. macOS・Windows のテスト（cross-platform.yml）
# 2. GoReleaser で Release の下書きと ghcr.io/kga/mcrl のイメージを作る
# 3. バイナリの版とアーカイブの数を確かめてから公開する（immutable releases のため公開は最後）
#
# 手動実行（workflow_dispatch）は、tag を指定すればそのタグのリリースをやり直し、
# 空ならスナップショットを作るだけで何も公開しない。
# リポジトリが private の間は artifact attestation が使えない（Enterprise Cloud が必要）ため付けない。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release again (empty = snapshot build only)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  cross-platform:
    uses: $/.github/workflows/cross-platform.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  goreleaser:
    needs: cross-platform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # GitHub Releases
      packages: write # ghcr.io
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.tag != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.20.0
          args: release --clean ${{ env.PUBLISH != 'true' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the built binary and the draft
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          got=$(./dist/mcrl_linux_amd64_v1/mcrl version --jq .version)
          if [ "v$got" != "$TAG" ]; then
            echo "::error::the binary reports version $got, not $TAG"
            exit 1
          fi
          want=$(grep -c . dist/checksums.txt)
          have=$(gh release view "$TAG" --json assets --jq '[.assets[] | select(.name != "checksums.txt")] | length')
          if [ "$have" -ne "$want" ]; then
            echo "::error::the draft has $have archives, expected $want"
            exit 1
          fi
      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --draft=false
      - name: Verify the release attestation
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # immutable release の attestation は公開直後に作られるので、少し待って確かめる。
          # private リポジトリで作られない場合もあるので、確かめられなくても失敗にはしない
          for i in 1 2 3 4 5 6; do
            if gh release verify "$TAG"; then exit 0; fi
            sleep 10
          done
          echo "::warning::could not verify the release attestation of $TAG yet"
