name: Cross-platform

# macOS・Windows のテスト。リリースのとき（release.yml から、タグのコミットに対して呼ばれる）と
# 手動実行で回す。PR と main への push では ci.yml のテストが同じ OS を回している
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
      - run: go test ./...
