name: tagpr

# main に push されるたびにリリース PR を作る・更新し、マージされたらタグを打つ。
# GitHub App のトークンを使うので、
# - リリース PR でも CI が動き、main の必須チェック（ci-ok）を満たせる
# - tagpr が打ったタグで release.yml が起動する（GITHUB_TOKEN のタグは別 workflow を起動しない）
# App の Client ID（変数 TAGPR_APP_CLIENT_ID）と秘密鍵（シークレット TAGPR_APP_PRIVATE_KEY）は
# Environment「tagpr」に置き、main からだけ使えるようにしてある（PR のブランチの workflow からは読めない）。
# GITHUB_TOKEN による push は workflow を起動しない。dependabot-auto-merge.yml が GITHUB_TOKEN で
# auto-merge を設定した PR のマージでは、ここが起動しないことがある。その時は main で手動実行する
# （次に人がマージした時にも、それまでの変更はまとめてリリース PR に入る）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tagpr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: tagpr
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.TAGPR_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAGPR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - uses: Songmu/tagpr@v1.21.4
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
