name: tagpr

# main に push されるたびにリリース PR を作る・更新し、マージされたらタグを打つ。
# GitHub App のトークンを使うので、
# - リリース PR でも CI が動き、main の必須チェック（ci-ok）を満たせる
# - tagpr が打ったタグで release.yml が起動する（GITHUB_TOKEN のタグは別 workflow を起動しない）
# App の Client ID は変数 TAGPR_APP_CLIENT_ID、秘密鍵はシークレット TAGPR_APP_PRIVATE_KEY に置く。
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tagpr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.TAGPR_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAGPR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - uses: Songmu/tagpr@v1.21.4
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
