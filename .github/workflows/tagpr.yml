name: tagpr

# main に push されるたびにリリース PR を作る・更新する。リリース PR をマージすると
# tagpr がタグを打ち、続けて macOS・Windows のテストとリリース（GitHub Releases の下書き・ghcr）を行う。
# GITHUB_TOKEN で打ったタグは別の workflow を起動しないので、同じ workflow の中で呼び出す。
# 呼び出しは ./ ではなく $/ で書く: ランナーに checkout された内容ではなく、この workflow と同じ
# コミットの workflow が使われ、このリポジトリの actions.lock が正しく適用される。
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tagpr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: tagpr
        uses: Songmu/tagpr@v1.21.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cross-platform:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    uses: $/.github/workflows/cross-platform.yml
    with:
      ref: ${{ needs.tagpr.outputs.tag }}

  release:
    needs: [tagpr, cross-platform]
    if: needs.tagpr.outputs.tag != ''
    permissions:
      contents: write
      packages: write
    uses: $/.github/workflows/release.yml
    with:
      tag: ${{ needs.tagpr.outputs.tag }}
